<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="icon" href="app-icon.jpeg" type="image/jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUMEN - Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- KaTeX for LaTeX rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <script src="utils.js"></script>
    <script src="sw-register.js"></script>
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar Navigation (Desktop) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-square-poll-vertical brand-logo-icon"></i>
                <span>LUMEN</span>
            </div>

            
            <div class="menu-section">
                <span class="menu-title">মেনু</span>
                <nav class="sidebar-nav">
                    <a href="index.html" class="sidebar-nav-item" id="side-home">
                        <i class="fa-solid fa-house"></i>
                        <span>ড্যাশবোর্ড (Dashboard)</span>
                    </a>
                    <a href="subjects.html" class="sidebar-nav-item" id="side-chapter">
                        <i class="fa-regular fa-folder-open"></i>
                        <span>অধ্যায়ভিত্তিক প্রস্তুতি</span>
                    </a>
                    <a href="subjects.html" class="sidebar-nav-item" id="side-board">
                        <i class="fa-solid fa-building-columns"></i>
                        <span>বোর্ড প্রশ্ন প্রস্তুতি</span>
                    </a>
                    <a href="subjects.html" class="sidebar-nav-item" id="side-cq">
                        <i class="fa-solid fa-file-signature"></i>
                        <span>সৃজনশীল প্রশ্ন (CQ)</span>
                    </a>
                    <a href="#" class="sidebar-nav-item">
                        <i class="fa-solid fa-award"></i>
                        <span>ইউনিভার্সিটি প্রশ্ন</span>
                    </a>
                </nav>
            </div>

            <div class="menu-section">
                <span class="menu-title">প্রোফাইল</span>
                <nav class="sidebar-nav">
                    <a href="#" class="sidebar-nav-item">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>মাই প্রগ্রেস <span class="badge-beta">BETA</span></span>
                    </a>
                    <a href="#" class="sidebar-nav-item">
                        <i class="fa-solid fa-bookmark"></i>
                        <span>মাই ফেভারিট</span>
                    </a>
                </nav>
            </div>

            <!-- Profile Info and Footer -->
            <div class="sidebar-profile">
                <div class="profile-card">
                    <div class="profile-avatar">S</div>
                    <div class="profile-info">
                        <span class="profile-name">Sujon <span class="badge-pro">PRO</span></span>
                        <span class="profile-subtitle">hsc</span>
                    </div>
                </div>
                <div class="sidebar-footer">
                    <div class="theme-toggle">
                        <i class="fa-solid fa-sun"></i>
                    </div>
                    <i class="fa-solid fa-gear sidebar-footer-icon"></i>
                    <i class="fa-solid fa-right-from-bracket sidebar-footer-icon"></i>
                </div>
            </div>
        </aside>

        <!-- Main Workspace Pane -->
        <div class="main-workspace">
            <!-- Top Workspace Header -->
            <header class="workspace-header">
                <div class="header-left">
                    <button class="menu-toggle-btn" id="menu-toggle">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <button class="back-btn" id="back-btn">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="breadcrumb" id="breadcrumb-path">
                        <!-- Clickable breadcrumbs -->
                    </div>
                </div>
                <div class="header-right">
                    <div class="profile-icon">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </header>

            <!-- Workspace Content Area -->
            <main class="app-container">
                
                <!-- MCQ View -->
                <div id="mcq-view" class="app-view active">
                    <div class="mcq-view-header">
                        <div class="mcq-view-title-area">
                            <h3 id="mcq-view-title">Practice MCQ</h3>
                        </div>
                        <div class="show-answer-toggle">
                            <span>উত্তর দেখুন:</span>
                            <label class="switch">
                                <input type="checkbox" id="show-answer-switch">
                                <span class="slider round"></span>
                            </label>
                        </div>
                    </div>
                    <div id="mcq-container" class="mcq-list">
                        <!-- Questions dynamically loaded here -->
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav glass-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            <span>Progress</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-bookmark"></i>
            <span>Saved</span>
        </a>
    </nav>

    <script src="mcq.js"></script>
</body>
</html>
