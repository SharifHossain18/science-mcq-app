<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMEN MCQ Organizer - Admin Panel</title>
    <!-- Outfit Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- KaTeX for math typesetting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --primary-blue: #2563eb;
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--primary-gradient);
            color: #ffffff;
            padding: 20px 40px;
            box-shadow: 0 4px 20px rgba(29, 78, 216, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-size: 1.6rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 1.5px 3px rgba(0,0,0,0.15);
        }

        .header-title span {
            font-weight: 400;
            opacity: 0.85;
            font-size: 0.95rem;
        }

        .admin-badge {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .main-container {
            max-width: 1000px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px 60px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        /* Subject selector & Status panel */
        .control-panel {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .selector-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 280px;
        }

        .selector-label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        select {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: #f1f5f9;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:focus {
            border-color: var(--primary-blue);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .stats-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-badge {
            background: #eff6ff;
            color: var(--primary-blue);
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            border: 1px dashed rgba(37, 99, 235, 0.3);
        }

        /* Question display area */
        .workspace {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
            padding: 30px;
            transition: transform 0.3s ease;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 18px;
            margin-bottom: 20px;
        }

        .mcq-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 700;
            display: flex;
            gap: 12px;
        }

        .mcq-meta span {
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .question-body {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 24px;
            color: var(--text-main);
        }

        .options-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        @media(min-width: 600px) {
            .options-list {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-item {
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #fafafa;
        }

        .option-item.correct {
            border-color: var(--success-color);
            background-color: #ecfdf5;
            color: #047857;
        }

        .option-marker {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            background: #cbd5e1;
            color: var(--text-main);
        }

        .option-item.correct .option-marker {
            background: var(--success-color);
            color: #ffffff;
        }

        .explanation-box {
            background-color: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 16px;
            padding: 20px;
            font-size: 0.95rem;
            margin-top: 20px;
            color: #78350f;
        }

        .explanation-title {
            font-weight: 800;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Action bar for moving questions */
        .action-panel {
            background: #f8fafc;
            border-top: 1px solid var(--border-color);
            padding: 24px 0 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .destination-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 8px;
        }

        button {
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
        }

        .btn-secondary {
            background: #ffffff;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .no-data {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .no-data i {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #cbd5e1;
        }

        .no-data h3 {
            font-size: 1.4rem;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        /* Success alerts */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #065f46;
            color: #ffffff;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            font-weight: 700;
            display: none;
            z-index: 1000;
            align-items: center;
            gap: 10px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1><i class="fa-solid fa-folder-tree"></i> LUMEN MCQ Organizer <span>| Data Sanitization</span></h1>
        </div>
        <div class="admin-badge"><i class="fa-solid fa-shield-halved"></i> Administrator</div>
    </header>

    <div class="main-container">

        <!-- Controls -->
        <div class="control-panel">
            <div class="selector-group">
                <span class="selector-label">Select Subject:</span>
                <select id="subject-selector">
                    <option value="" disabled selected>-- Choose Subject --</option>
                </select>
            </div>
            <div class="stats-group">
                <div class="stat-badge" id="stats-counter">General Queue: 0</div>
            </div>
        </div>

        <!-- Working Area -->
        <div class="workspace" id="workspace">
            <div class="no-data">
                <i class="fa-solid fa-box-open"></i>
                <h3>No Subject Selected</h3>
                <p>Select a subject from the dropdown above to load the General questions queue.</p>
            </div>
        </div>

    </div>

    <!-- Alert toast -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i> <span id="toast-text">Question moved successfully!</span>
    </div>

    <script>
        let metaData = {};
        let generalQuestions = [];
        let currentIndex = 0;
        let selectedSubject = '';

        // Load metadata (Subjects and Chapters) on load
        async function fetchMetadata() {
            try {
                const response = await fetch('/api/metadata');
                metaData = await response.json();
                populateSubjectDropdown();
            } catch (err) {
                console.error("Error loading metadata:", err);
                alert("Failed to load subject metadata. Ensure backend categorize_server.js is running.");
            }
        }

        function populateSubjectDropdown() {
            const selector = document.getElementById('subject-selector');
            selector.innerHTML = '<option value="" disabled selected>-- Choose Subject --</option>';
            
            Object.keys(metaData).forEach(subject => {
                const opt = document.createElement('option');
                opt.value = subject;
                opt.textContent = subject;
                selector.appendChild(opt);
            });
        }

        // Listener for Subject Selection Change
        document.getElementById('subject-selector').addEventListener('change', async (e) => {
            selectedSubject = e.target.value;
            currentIndex = 0;
            document.getElementById('workspace').innerHTML = '<div class="no-data"><i class="fa-solid fa-spinner fa-spin"></i><h3>Loading queue...</h3></div>';
            
            try {
                const res = await fetch(`/api/general-questions?subject=${encodeURIComponent(selectedSubject)}`);
                generalQuestions = await res.json();
                
                updateStats();
                renderCurrentQuestion();
            } catch (err) {
                console.error("Error fetching general queue:", err);
                alert("Failed to fetch general questions.");
            }
        });

        function updateStats() {
            const counter = document.getElementById('stats-counter');
            counter.textContent = `General Queue: ${generalQuestions.length} remaining`;
        }

        // Render the current MCQ at currentIndex
        function renderCurrentQuestion() {
            const workspace = document.getElementById('workspace');

            if (generalQuestions.length === 0) {
                workspace.innerHTML = `
                    <div class="no-data">
                        <i class="fa-solid fa-circle-check" style="color: var(--success-color);"></i>
                        <h3>Queue Clean & Pure!</h3>
                        <p>No remaining General questions for <strong>${selectedSubject}</strong>.</p>
                    </div>
                `;
                return;
            }

            const q = generalQuestions[currentIndex];
            const chapters = metaData[selectedSubject].chapters.filter(ch => ch.id !== 'ch_1'); // Exclude General

            // Options mapping markers (A, B, C, D)
            const optionMarkers = ['ক', 'খ', 'গ', 'ঘ'];
            let optionsHtml = '';
            
            q.options.forEach((opt, index) => {
                const isCorrect = opt === q.answer;
                optionsHtml += `
                    <div class="option-item ${isCorrect ? 'correct' : ''}">
                        <div class="option-marker">${optionMarkers[index]}</div>
                        <div class="option-text">${opt}</div>
                    </div>
                `;
            });

            // Chapter Dropdown HTML options
            let chapterOptions = '<option value="" disabled selected>-- Choose target Chapter --</option>';
            chapters.forEach(ch => {
                chapterOptions += `<option value="${ch.id}">${ch.name}</option>`;
            });

            workspace.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <div class="mcq-meta">
                            <span>ID: ${q.id}</span>
                            <span>Year: ${q.year}</span>
                            <span>Board: ${q.board}</span>
                        </div>
                        <div style="font-weight: 700; font-size: 0.85rem; color: var(--warning-color);">
                            <i class="fa-solid fa-circle-question"></i> Uncategorized General Question
                        </div>
                    </div>

                    <div class="question-body" id="math-render-area">
                        ${q.question}
                    </div>

                    <div class="options-list">
                        ${optionsHtml}
                    </div>

                    ${q.explanation ? `
                    <div class="explanation-box">
                        <div class="explanation-title">
                            <i class="fa-solid fa-lightbulb"></i> Explanation / Solution
                        </div>
                        <div>${q.explanation}</div>
                    </div>
                    ` : ''}

                    <!-- Action Bar -->
                    <div class="action-panel">
                        <div class="destination-row">
                            <span class="selector-label" style="margin-top: 8px;">Move to Chapter:</span>
                            <select id="chapter-target-select" style="flex: 2; min-width: 250px;">
                                ${chapterOptions}
                            </select>
                        </div>

                        <div class="btn-group">
                            <button class="btn-secondary" onclick="skipQuestion()">
                                <i class="fa-solid fa-forward"></i> Skip / Next
                            </button>
                            <button class="btn-primary" onclick="moveQuestion()">
                                <i class="fa-solid fa-arrow-right-to-bracket"></i> Move Question
                            </button>
                        </div>
                    </div>
                </div>
            `;

            // Auto-render math equations inside cards
            renderMathInElement(document.getElementById('workspace'), {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError: false
            });
        }

        // Post back to API to move question
        async function moveQuestion() {
            const dropdown = document.getElementById('chapter-target-select');
            const targetChapterId = dropdown.value;
            const targetChapterName = dropdown.options[dropdown.selectedIndex].text;

            if (!targetChapterId) {
                alert("Please select a target chapter first!");
                return;
            }

            const q = generalQuestions[currentIndex];

            try {
                const response = await fetch('/api/move-question', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        subject: selectedSubject,
                        questionId: q.id,
                        targetChapterId: targetChapterId,
                        targetChapterName: targetChapterName
                    })
                });

                const result = await response.json();
                if (result.success) {
                    showToast(`Moved to ${targetChapterName}!`);
                    
                    // Remove from local list
                    generalQuestions.splice(currentIndex, 1);
                    
                    // Keep index bound checked
                    if (currentIndex >= generalQuestions.length) {
                        currentIndex = 0;
                    }
                    
                    updateStats();
                    renderCurrentQuestion();
                } else {
                    alert("Failed to move question: " + result.error);
                }
            } catch (err) {
                console.error("Error moving question:", err);
                alert("Error moving question.");
            }
        }

        // Skip to next item in the queue
        function skipQuestion() {
            if (generalQuestions.length === 0) return;
            currentIndex = (currentIndex + 1) % generalQuestions.length;
            renderCurrentQuestion();
        }

        // Simple toast visual alert
        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = text;
            toast.style.display = 'flex';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2500);
        }

        // Init
        fetchMetadata();
    </script>
</body>
</html>
