<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="icon" href="app-icon.jpeg" type="image/jpeg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUMEN - Board Questions</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="sw-register.js"></script>
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-square-poll-vertical brand-logo-icon"></i>
                <span>LUMEN</span>
            </div>
            <div class="menu-section">
                <span class="menu-title">মেনু</span>
                <nav class="sidebar-nav">
                    <a href="index.html" class="sidebar-nav-item" id="side-home">
                        <i class="fa-solid fa-house"></i><span>ড্যাশবোর্ড (Dashboard)</span>
                    </a>
                    <a href="subjects.html" class="sidebar-nav-item" id="side-chapter">
                        <i class="fa-regular fa-folder-open"></i><span>অধ্যায়ভিত্তিক প্রস্তুতি</span>
                    </a>
                    <a href="subjects.html" class="sidebar-nav-item" id="side-board">
                        <i class="fa-solid fa-building-columns"></i><span>বোর্ড প্রশ্ন প্রস্তুতি</span>
                    </a>
                    <a href="subjects.html" class="sidebar-nav-item" id="side-cq">
                        <i class="fa-solid fa-file-signature"></i><span>সৃজনশীল প্রশ্ন (CQ)</span>
                    </a>
                </nav>
            </div>
            <div class="sidebar-profile">
                <div class="profile-card">
                    <div class="profile-avatar">S</div>
                    <div class="profile-info">
                        <span class="profile-name">Sujon <span class="badge-pro">PRO</span></span>
                        <span class="profile-subtitle">hsc</span>
                    </div>
                </div>
                <div class="sidebar-footer">
                    <div class="theme-toggle"><i class="fa-solid fa-sun"></i></div>
                    <a href="mover.html" style="color:inherit;"><i class="fa-solid fa-gear sidebar-footer-icon"></i></a>
                    <i class="fa-solid fa-right-from-bracket sidebar-footer-icon"></i>
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <div class="main-workspace">
            <header class="workspace-header">
                <div class="header-left">
                    <button class="menu-toggle-btn" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
                    <button class="back-btn" id="back-btn"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="breadcrumb">
                        <span class="breadcrumb-item" onclick="window.location.href='index.html'">Home</span>
                        <span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right" style="font-size:0.7rem;"></i></span>
                        <span class="breadcrumb-item" id="bc-subject" onclick="window.location.href='subject.html'" style="cursor:pointer;">Subject</span>
                        <span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right" style="font-size:0.7rem;"></i></span>
                        <span class="breadcrumb-item active">Board Questions</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="profile-icon"><i class="fa-solid fa-user"></i></div>
                </div>
            </header>

            <main class="app-container">

                <!-- Subject strip (colored) -->
                <div class="bs-subject-strip" id="bs-subject-strip">
                    <div class="bs-strip-icon" id="bs-strip-icon">
                        <i class="fa-solid fa-atom"></i>
                    </div>
                    <div class="bs-strip-info">
                        <div class="bs-strip-name" id="bs-strip-name">Subject</div>
                        <div class="bs-strip-mode" id="bs-strip-mode">MCQ — Board Questions</div>
                    </div>
                </div>

                <!-- Year Slider -->
                <div class="bs-section-label">
                    <i class="fa-solid fa-calendar-days"></i> বছর নির্বাচন করুন (Select Year)
                </div>
                <div class="bs-year-slider" id="bs-year-slider">
                    <!-- dynamically populated -->
                </div>

                <!-- Board Grid (2 per row) -->
                <div class="bs-section-label">
                    <i class="fa-solid fa-building-columns"></i> বোর্ড নির্বাচন করুন (Select Board)
                </div>
                <div class="bs-board-grid" id="bs-board-grid">
                    <!-- dynamically populated -->
                </div>

                <!-- Start Practice Button -->
                <button class="bs-start-btn" id="bs-start-btn" disabled>
                    <i class="fa-solid fa-play"></i>
                    <span id="bs-start-label">বছর ও বোর্ড নির্বাচন করুন</span>
                </button>

            </main>
        </div>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav glass-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i><span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-chart-line"></i><span>Progress</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-bookmark"></i><span>Saved</span>
        </a>
    </nav>

    <script src="board-select.js"></script>
</body>
</html>
